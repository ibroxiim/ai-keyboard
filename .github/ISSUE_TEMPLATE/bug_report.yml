name: Xato haqida xabar / Bug report
description: Nimadir ishlamayapti yoki kutilganidek emas
title: "[Xato] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Rahmat! Qancha aniq yozsangiz, shuncha tez tuzatiladi. English is fine too.
  - type: dropdown
    id: area
    attributes:
      label: Qaysi qism?
      options:
        - Klaviatura (yozish, tugmalar, lag)
        - Back Tap / skrinshot tahlili
        - ✨ tarjima
        - Do'stlar / til tanlash
        - Emoji paneli
        - Ilova (sozlash ekrani)
        - Boshqa
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Nima bo'ldi?
      description: Nima qildingiz, nima kutdingiz va aslida nima bo'ldi.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Qanday takrorlash mumkin?
      placeholder: |
        1. Instagram DM'ni ochdim
        2. Orqaga 2 marta urdim
        3. ...
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Qurilma va iOS versiyasi
      placeholder: "iPhone 14 Pro, iOS 27.0"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Qaysi ilovada yozayotgan edingiz?
      placeholder: "Instagram, Telegram, WhatsApp..."
  - type: textarea
    id: screenshots
    attributes:
      label: Skrinshot yoki video
      description: Boshqa odamlarning ismlari va xabarlarini albatta yashiring.
  - type: checkboxes
    id: privacy
    attributes:
      label: Maxfiylik
      options:
        - label: Qo'shgan skrinshotlarimda boshqa odamlarning shaxsiy ma'lumoti yo'q yoki yashirilgan
          required: true
